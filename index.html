<!doctype html>
<html lang="en" data-theme="qbasic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compendium BASIC IDE</title>
<meta name="description" content="A retro GW-BASIC and QBasic IDE in your browser: write, run and debug BASIC with every classic screen mode, sound, files and guided tours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230000aa'/%3E%3Cpath d='M3 4h6v1H4v2h4v1H4v3H3z' fill='%23ffff55'/%3E%3Crect x='10' y='10' width='3' height='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ===== Theme tokens ===================================================== */
:root, :root[data-theme="qbasic"] {
  --bg: #000080;
  --pane: #0000aa;
  --pane2: #00007a;
  --pane-head: #aaaaaa;
  --pane-head-fg: #000000;
  --text: #e8e8e8;
  --muted: #9ab0ff;
  --border: #5555ff;
  --accent: #55ffff;
  --accent-fg: #000;
  --btn: #aaaaaa;
  --btn-fg: #000;
  --btn-hover: #ffffff;
  --menu: #aaaaaa;
  --menu-fg: #000;
  --menu-hot: #ff5555;
  --menu-sel: #000000;
  --menu-sel-fg: #ffffff;
  --input: #000060;
  --ed-bg: #0000aa;
  --ed-fg: #c8c8c8;
  --ed-gutter: #00008a;
  --ed-gutter-fg: #6f7fe0;
  --ed-caret: #ffff55;
  --ed-sel: rgba(170, 170, 170, .45);
  --ed-cur: rgba(255, 255, 255, .06);
  --syn-kw: #ffffff;
  --syn-fn: #55ffff;
  --syn-str: #ffff55;
  --syn-num: #ff55ff;
  --syn-com: #55ff55;
  --syn-lbl: #ffaa55;
  --syn-op: #c8c8c8;
  --syn-meta: #ff5555;
  --exec: rgba(255, 255, 85, .30);
  --exec-border: #ffff55;
  --frame: rgba(85, 255, 255, .18);
  --bp: #ff5555;
  --err: #ff5555;
  --ok: #55ff55;
  --warn: #ffff55;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  --radius: 0px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --ed-font-size: 15px;
  --screen-bezel: #1a1a1a;
  color-scheme: dark;
}
:root[data-theme="dark"] {
  --bg: #15171c; --pane: #1d2027; --pane2: #171a20; --pane-head: #262a33; --pane-head-fg: #c9d1e0;
  --text: #d7dce6; --muted: #8b93a6; --border: #2e3340; --accent: #6cb6ff; --accent-fg: #0b1220;
  --btn: #2b303b; --btn-fg: #d7dce6; --btn-hover: #384050;
  --menu: #1d2027; --menu-fg: #d7dce6; --menu-hot: #6cb6ff; --menu-sel: #2f3a52; --menu-sel-fg: #fff;
  --input: #12141a;
  --ed-bg: #16181d; --ed-fg: #d4d4d4; --ed-gutter: #16181d; --ed-gutter-fg: #5b6272; --ed-caret: #6cb6ff;
  --ed-sel: rgba(108, 182, 255, .28); --ed-cur: rgba(255,255,255,.04);
  --syn-kw: #c792ea; --syn-fn: #82aaff; --syn-str: #c3e88d; --syn-num: #f78c6c; --syn-com: #6a7a8c; --syn-lbl: #ffcb6b; --syn-op: #89ddff; --syn-meta: #ff5370;
  --exec: rgba(255, 203, 107, .22); --exec-border: #ffcb6b; --frame: rgba(130, 170, 255, .14);
  --bp: #f14c4c; --err: #f14c4c; --ok: #4ec98a; --warn: #ffcb6b;
  --radius: 6px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef0f4; --pane: #ffffff; --pane2: #f6f7f9; --pane-head: #e6e9ef; --pane-head-fg: #333a47;
  --text: #1f2430; --muted: #687083; --border: #d4d8e0; --accent: #0b62d6; --accent-fg: #fff;
  --btn: #e9ecf2; --btn-fg: #1f2430; --btn-hover: #dde2ea;
  --menu: #ffffff; --menu-fg: #1f2430; --menu-hot: #0b62d6; --menu-sel: #0b62d6; --menu-sel-fg: #fff;
  --input: #ffffff;
  --ed-bg: #ffffff; --ed-fg: #1f2430; --ed-gutter: #f6f7f9; --ed-gutter-fg: #9aa1b0; --ed-caret: #0b62d6;
  --ed-sel: rgba(11, 98, 214, .18); --ed-cur: rgba(0,0,0,.035);
  --syn-kw: #0b3ea8; --syn-fn: #7a3e9d; --syn-str: #a31515; --syn-num: #098658; --syn-com: #6a737d; --syn-lbl: #b35c00; --syn-op: #444; --syn-meta: #c00;
  --exec: rgba(255, 213, 0, .35); --exec-border: #c9a400; --frame: rgba(11, 98, 214, .10);
  --bp: #d32f2f; --err: #d32f2f; --ok: #2e7d32; --warn: #b26a00;
  --radius: 6px;
  color-scheme: light;
}
:root[data-theme="amber"] {
  --bg: #100800; --pane: #160c00; --pane2: #0d0700; --pane-head: #3a2400; --pane-head-fg: #ffb000;
  --text: #ffb000; --muted: #b07a00; --border: #4a3000; --accent: #ffcc33; --accent-fg: #100800;
  --btn: #2a1a00; --btn-fg: #ffb000; --btn-hover: #3d2600;
  --menu: #1c1000; --menu-fg: #ffb000; --menu-hot: #ffe08a; --menu-sel: #ffb000; --menu-sel-fg: #100800;
  --input: #0d0700;
  --ed-bg: #120900; --ed-fg: #ffb000; --ed-gutter: #0d0700; --ed-gutter-fg: #7a5200; --ed-caret: #ffe08a;
  --ed-sel: rgba(255, 176, 0, .25); --ed-cur: rgba(255,176,0,.05);
  --syn-kw: #ffe08a; --syn-fn: #ffcc66; --syn-str: #ffd27a; --syn-num: #ffc04d; --syn-com: #9c6a00; --syn-lbl: #fff0c0; --syn-op: #ffb000; --syn-meta: #ff8040;
  --exec: rgba(255, 176, 0, .25); --exec-border: #ffe08a; --frame: rgba(255,176,0,.12);
  --bp: #ff6030; --err: #ff6030; --ok: #ffe08a; --warn: #ffd27a;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #eef0f4; --pane: #ffffff; --pane2: #f6f7f9; --pane-head: #e6e9ef; --pane-head-fg: #333a47;
    --text: #1f2430; --muted: #687083; --border: #d4d8e0; --accent: #0b62d6; --accent-fg: #fff;
    --btn: #e9ecf2; --btn-fg: #1f2430; --btn-hover: #dde2ea;
    --menu: #ffffff; --menu-fg: #1f2430; --menu-hot: #0b62d6; --menu-sel: #0b62d6; --menu-sel-fg: #fff;
    --input: #fff; --ed-bg: #fff; --ed-fg: #1f2430; --ed-gutter: #f6f7f9; --ed-gutter-fg: #9aa1b0; --ed-caret: #0b62d6;
    --ed-sel: rgba(11, 98, 214, .18); --ed-cur: rgba(0,0,0,.035);
    --syn-kw: #0b3ea8; --syn-fn: #7a3e9d; --syn-str: #a31515; --syn-num: #098658; --syn-com: #6a737d; --syn-lbl: #b35c00; --syn-op: #444; --syn-meta: #c00;
    --exec: rgba(255, 213, 0, .35); --exec-border: #c9a400; --frame: rgba(11, 98, 214, .10);
    --bp: #d32f2f; --err: #d32f2f; --ok: #2e7d32; --warn: #b26a00; --radius: 6px; color-scheme: light;
  }
}

/* ===== Base ============================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--font-ui); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hidden, [hidden] { display: none !important; }
kbd { font: 11px var(--font-code); padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--pane2); }
a { color: var(--accent); }

.app { display: grid; height: 100vh; height: 100dvh; grid-template-rows: auto auto auto minmax(0, 1fr) auto var(--bottom-h, 230px) auto;
  grid-template-areas: "menu" "tool" "mtabs" "work" "split" "bottom" "status"; }
.menubar { grid-area: menu; } .toolbar { grid-area: tool; } .mobile-tabs { grid-area: mtabs; } .workspace { grid-area: work; }
.splitter.h { grid-area: split; } .bottom { grid-area: bottom; } .statusbar { grid-area: status; }

/* ===== Menu bar ========================================================== */
.menubar { display: flex; align-items: center; gap: 2px; background: var(--menu); color: var(--menu-fg); padding: 0 6px; min-height: 26px; position: relative; z-index: 20; user-select: none; }
.menubar .brand { font-weight: 700; margin-right: 10px; letter-spacing: .5px; display: flex; align-items: center; gap: 6px; }
.menubar .brand .logo { width: 16px; height: 16px; background: #0000aa; border: 1px solid #55ffff; display: inline-grid; place-items: center; color: #ffff55; font: 700 10px var(--font-code); }
.menu-btn { background: none; border: 0; padding: 3px 9px; color: inherit; border-radius: var(--radius); }
.menu-btn .hot { color: var(--menu-hot); text-decoration: none; }
.menu-btn:hover, .menu-btn.open { background: var(--menu-sel); color: var(--menu-sel-fg); }
.menu-btn:hover .hot, .menu-btn.open .hot { color: var(--menu-sel-fg); }
.menubar .spacer { flex: 1; }
.menubar .proj { opacity: .8; font-size: 12px; margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.menu-pop { position: fixed; min-width: 240px; background: var(--menu); color: var(--menu-fg); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 4px 0; z-index: 1000; border-radius: var(--radius); max-height: 80vh; overflow: auto; }
:root[data-theme="qbasic"] .menu-pop { border: 2px solid #000; box-shadow: 6px 6px 0 #000; }
.menu-item { display: flex; align-items: center; gap: 16px; padding: 4px 14px 4px 22px; cursor: default; white-space: nowrap; position: relative; }
.menu-item .sc { margin-left: auto; opacity: .7; font-size: 11px; }
.menu-item:hover, .menu-item.active { background: var(--menu-sel); color: var(--menu-sel-fg); }
.menu-item.disabled { opacity: .45; pointer-events: none; }
.menu-item.checked::before { content: "✓"; position: absolute; left: 7px; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
.menu-item .sub-arrow { margin-left: auto; }

/* ===== Toolbar =========================================================== */
.toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: var(--pane2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tb-btn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border: 1px solid var(--border); background: var(--btn); color: var(--btn-fg); border-radius: var(--radius); white-space: nowrap; }
.tb-btn:hover:not(:disabled) { background: var(--btn-hover); }
.tb-btn:disabled { opacity: .4; cursor: default; }
.tb-btn svg { width: 15px; height: 15px; flex: none; }
.tb-btn.primary { background: var(--ok); color: #000; border-color: transparent; font-weight: 600; }
:root[data-theme="dark"] .tb-btn.primary, :root[data-theme="light"] .tb-btn.primary { color: #fff; background: #2e8b57; }
.tb-btn.danger { color: var(--err); }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.tb-group { display: inline-flex; gap: 4px; align-items: center; }
.tb-label { font-size: 12px; color: var(--muted); }
.toolbar select, .toolbar input[type=range] { height: 26px; background: var(--input); border: 1px solid var(--border); border-radius: var(--radius); }
.toolbar .grow { flex: 1; }
.state-pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--pane); border: 1px solid var(--border); }
.state-pill.running { color: var(--ok); }
.state-pill.paused { color: var(--warn); }
.state-pill.error { color: var(--err); }

/* ===== Workspace ========================================================= */
.workspace { display: grid; grid-template-columns: var(--explorer-w, 210px) 4px minmax(240px, 1fr) 4px var(--screen-w, 46%); min-height: 0; }
.workspace.no-explorer { grid-template-columns: 0 0 minmax(240px, 1fr) 4px var(--screen-w, 46%); }
.workspace.no-explorer .explorer { display: none; }
.pane { background: var(--pane); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 3px 8px; background: var(--pane-head); color: var(--pane-head-fg); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; min-height: 26px; }
.pane-head.small { font-size: 11px; }
.pane-actions { display: inline-flex; gap: 2px; }
.icon-btn { background: none; border: 0; padding: 3px 5px; border-radius: var(--radius); color: inherit; display: inline-grid; place-items: center; }
.icon-btn:hover { background: rgba(127,127,127,.25); }
.icon-btn svg { width: 15px; height: 15px; }
.splitter { background: var(--border); }
.splitter.v { cursor: col-resize; }
.splitter.h { cursor: row-resize; height: 4px; }
.splitter:hover, .splitter.dragging { background: var(--accent); }
body.resizing { user-select: none; }
body.resizing iframe, body.resizing canvas { pointer-events: none; }

/* ===== Explorer ========================================================== */
.explorer-body { flex: 1; overflow: auto; padding: 4px 0; min-height: 60px; }
.tree-item { display: flex; align-items: center; gap: 5px; padding: 2px 8px; cursor: pointer; white-space: nowrap; user-select: none; }
.tree-item:hover { background: rgba(127,127,127,.18); }
.tree-item.selected { background: var(--menu-sel); color: var(--menu-sel-fg); }
.tree-item .tw { width: 12px; text-align: center; opacity: .7; flex: none; }
.tree-item svg { width: 15px; height: 15px; flex: none; opacity: .9; }
.tree-item .nm { overflow: hidden; text-overflow: ellipsis; }
.tree-item .badge { margin-left: auto; font-size: 10px; opacity: .7; }
.tree-item.main .nm { font-weight: 700; }
.proc-list { max-height: 30%; overflow: auto; padding: 2px 0; }
.proc-item { padding: 2px 10px; cursor: pointer; font-family: var(--font-code); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proc-item:hover { background: rgba(127,127,127,.18); }
.proc-item .k { color: var(--syn-kw); }

/* ===== Tabs ============================================================== */
.tabs { display: flex; align-items: stretch; gap: 1px; background: var(--pane2); overflow-x: auto; scrollbar-width: thin; min-height: 30px; flex: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); white-space: nowrap; border-top: 2px solid transparent; }
.tab.active { background: var(--pane); color: var(--text); border-top-color: var(--accent); }
.tab .dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.tab .x { opacity: .55; padding: 0 2px; border-radius: 3px; }
.tab .x:hover { opacity: 1; background: rgba(127,127,127,.3); }
.tab .count { font-size: 10px; background: var(--accent); color: var(--accent-fg); border-radius: 8px; padding: 0 5px; }

/* ===== Editor ============================================================ */
.editors { position: relative; flex: 1; min-height: 0; }
.ed { position: absolute; inset: 0; display: flex; background: var(--ed-bg); color: var(--ed-fg); font: var(--ed-font-size)/1.45 var(--font-code); }
.ed-gutter { flex: none; background: var(--ed-gutter); color: var(--ed-gutter-fg); overflow: hidden; position: relative; user-select: none; text-align: right; cursor: pointer; }
.ed-gutter-inner { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.ed-gl { position: relative; padding: 0 8px 0 22px; height: calc(var(--ed-font-size) * 1.45); white-space: pre; font-size: .85em; line-height: calc(var(--ed-font-size) * 1.45); }
.ed-gl.bp::before { content: ""; position: absolute; left: 5px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: var(--bp); }
.ed-gl.bp.cond::before { border-radius: 2px; }
.ed-gl.bp.disabled::before { background: transparent; border: 2px solid var(--bp); }
.ed-gl.exec::after { content: "▶"; position: absolute; left: 4px; top: 0; color: var(--exec-border); font-size: 12px; }
.ed-gl.frame::after { content: "◆"; position: absolute; left: 5px; top: 0; color: var(--accent); font-size: 10px; }
.ed-gl.err { color: var(--err); font-weight: 700; }
.ed-main { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.ed-hl, .ed-ta { position: absolute; inset: 0; margin: 0; padding: 0 12px 40vh 8px; border: 0; font: inherit; white-space: pre; tab-size: 4; overflow: auto; letter-spacing: 0; word-spacing: 0; }
.ed-hl { pointer-events: none; color: var(--ed-fg); overflow: hidden; }
.ed-ta { background: transparent; color: transparent; caret-color: var(--ed-caret); resize: none; outline: none; z-index: 1; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: var(--ed-sel); -webkit-text-fill-color: transparent; }
.ed-line { display: block; min-height: calc(var(--ed-font-size) * 1.45); }
.ed-line.exec { background: var(--exec); box-shadow: inset 3px 0 0 var(--exec-border); }
.ed-line.frame { background: var(--frame); }
.ed-line.bpline { background: rgba(255, 85, 85, .13); }
.ed-line.errline { background: rgba(255, 60, 60, .22); text-decoration: underline wavy var(--err); text-decoration-skip-ink: none; }
.ed-line.curline { background: var(--ed-cur); }
.ed-line.flash { animation: flash 1s ease-out; }
@keyframes flash { from { background: var(--exec); } to { background: transparent; } }
.s-kw { color: var(--syn-kw); font-weight: 600; }
:root[data-theme="qbasic"] .s-kw { font-weight: normal; }
.s-fn { color: var(--syn-fn); }
.s-str { color: var(--syn-str); }
.s-num { color: var(--syn-num); }
.s-com { color: var(--syn-com); font-style: italic; }
:root[data-theme="qbasic"] .s-com { font-style: normal; }
.s-lbl { color: var(--syn-lbl); font-weight: 600; }
.s-ln { color: var(--syn-lbl); }
.s-op { color: var(--syn-op); }
.s-meta { color: var(--syn-meta); }
.s-data { color: var(--syn-str); opacity: .85; }
.s-bad { color: var(--err); text-decoration: underline wavy; }
.ed-tip { position: fixed; z-index: 900; background: var(--menu); color: var(--menu-fg); border: 1px solid var(--border); padding: 4px 8px; font: 12px var(--font-code); box-shadow: var(--shadow); pointer-events: none; max-width: 480px; white-space: pre-wrap; border-radius: var(--radius); }
.findbar { display: flex; gap: 6px; align-items: center; padding: 4px 8px; background: var(--pane2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.findbar input { background: var(--input); border: 1px solid var(--border); padding: 3px 6px; min-width: 160px; border-radius: var(--radius); }
.findbar .info { color: var(--muted); font-size: 12px; }

/* ===== Screen ============================================================ */
.screen-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; background: var(--screen-bezel); position: relative; }
.screen-frame { position: relative; aspect-ratio: 4 / 3; max-width: 100%; max-height: 100%; width: 100%; background: #000; box-shadow: 0 0 0 2px #333, 0 0 30px rgba(0,0,0,.6); }
.screen-frame.square { aspect-ratio: var(--native-ar, 4 / 3); }
.screen-frame canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
.screen-frame canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.crt { position: absolute; inset: 0; pointer-events: none; display: none; background: repeating-linear-gradient(rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px); box-shadow: inset 0 0 60px rgba(0,0,0,.6); }
.crt.on { display: block; }
.screen-hint { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 11px; color: #aaa; pointer-events: none; opacity: 0; transition: opacity .3s; }
.screen-hint.show { opacity: 1; }
.screen-frame.focused { box-shadow: 0 0 0 2px var(--accent), 0 0 30px rgba(0,0,0,.6); }
.app.screen-max .screen-area { position: fixed; inset: 0; z-index: 500; }
.app.screen-max .screen-area .screen-wrap { padding: 0; background: #000; }
.screen-banner { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 4px 10px; font-size: 12px; border-radius: 4px; pointer-events: none; }

/* ===== Bottom panels ===================================================== */
.bottom { border-top: 1px solid var(--border); }
.bottom-body { flex: 1; min-height: 0; overflow: hidden; display: flex; }
.bpanel { flex: 1; min-width: 0; display: none; flex-direction: column; }
.bpanel.active { display: flex; }
.bpanel-tools { display: flex; gap: 4px; padding: 3px 6px; align-items: center; border-bottom: 1px solid var(--border); background: var(--pane2); flex-wrap: wrap; }
.bpanel-tools .grow { flex: 1; }
.bpanel-body { flex: 1; overflow: auto; font: 12.5px/1.45 var(--font-code); }
.small-btn { height: 24px; padding: 0 8px; border: 1px solid var(--border); background: var(--btn); color: var(--btn-fg); border-radius: var(--radius); font-size: 12px; }
.small-btn:hover { background: var(--btn-hover); }
.empty { padding: 14px; color: var(--muted); font-family: var(--font-ui); }
/* variables tree */
.vrow { display: grid; grid-template-columns: minmax(120px, 34%) 110px 1fr; align-items: center; border-bottom: 1px solid rgba(127,127,127,.12); min-height: 22px; }
.vrow:hover { background: rgba(127,127,127,.1); }
.vrow > div { padding: 1px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .vn { display: flex; align-items: center; gap: 3px; }
.vrow .vt { color: var(--muted); font-size: 11.5px; }
.vrow .vv { cursor: text; }
.vrow .vv.changed { color: var(--warn); font-weight: 700; }
.vrow .vv input { width: 100%; background: var(--input); border: 1px solid var(--accent); padding: 0 4px; font: inherit; }
.vsec { padding: 3px 8px; background: var(--pane2); color: var(--muted); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; z-index: 1; }
.twisty { width: 14px; display: inline-block; text-align: center; cursor: pointer; opacity: .7; }
.vbadge { font: 10px var(--font-ui); padding: 0 4px; border-radius: 3px; background: rgba(127,127,127,.25); color: var(--muted); }
/* call stack */
.frame-row { display: flex; gap: 8px; padding: 3px 8px; cursor: pointer; align-items: baseline; border-bottom: 1px solid rgba(127,127,127,.12); }
.frame-row:hover { background: rgba(127,127,127,.12); }
.frame-row.sel { background: var(--frame); }
.frame-row .depth { color: var(--muted); width: 22px; text-align: right; }
.frame-row .loc { color: var(--muted); margin-left: auto; }
.frame-sub { padding: 1px 8px 1px 40px; color: var(--muted); font-size: 11.5px; }
/* immediate */
.imm-log { flex: 1; overflow: auto; padding: 4px 8px; white-space: pre-wrap; }
.imm-log .in { color: var(--accent); }
.imm-log .err { color: var(--err); }
.imm-log .res { color: var(--text); }
.imm-log .note { color: var(--muted); font-family: var(--font-ui); }
.imm-input { display: flex; border-top: 1px solid var(--border); }
.imm-input span { padding: 4px 6px; color: var(--accent); font-family: var(--font-code); }
.imm-input input { flex: 1; border: 0; background: var(--input); padding: 4px; font-family: var(--font-code); outline: none; }
.list-row { display: flex; gap: 8px; align-items: center; padding: 2px 8px; border-bottom: 1px solid rgba(127,127,127,.12); }
.list-row:hover { background: rgba(127,127,127,.1); }
.list-row .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row input[type=text] { background: var(--input); border: 1px solid var(--border); padding: 1px 4px; font: inherit; min-width: 80px; }
.list-row .err { color: var(--err); }
.list-row .muted { color: var(--muted); }
.list-row.clickable { cursor: pointer; }
.printer { white-space: pre; padding: 8px 16px; background: repeating-linear-gradient(#fdfdf5 0 18px, #e9f5e9 18px 36px); color: #222; min-height: 100%; font: 13px/18px var(--font-code); }

/* ===== Status bar ======================================================== */
.statusbar { display: flex; gap: 14px; align-items: center; padding: 2px 10px; background: var(--menu); color: var(--menu-fg); font-size: 12px; min-height: 22px; white-space: nowrap; overflow: hidden; }
:root[data-theme="qbasic"] .statusbar { background: #00aaaa; color: #000; }
.statusbar .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.statusbar .msg-err { color: var(--err); font-weight: 600; }
:root[data-theme="qbasic"] .statusbar .msg-err { color: #aa0000; }

/* ===== Dialogs / overlays =============================================== */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 2000; padding: 16px; }
.modal { background: var(--pane); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); width: min(560px, 100%); max-height: 90vh; display: flex; flex-direction: column; border-radius: var(--radius); }
:root[data-theme="qbasic"] .modal { background: #aaaaaa; color: #000; border: 2px solid #fff; box-shadow: 8px 8px 0 #000; --input: #fff; --border: #555;
  --pane: #aaaaaa; --pane2: #c4c4c4; --text: #000; --muted: #2a2a2a; --accent: #0000aa; --accent-fg: #fff; --menu-sel: #0000aa; --menu-sel-fg: #fff;
  --btn: #aaaaaa; --btn-fg: #000; --btn-hover: #dcdcdc; --ok: #006400; --err: #aa0000; }
:root[data-theme="qbasic"] .modal .card { background: #d0d0d0; color: #000; }
:root[data-theme="qbasic"] .modal .card:hover { background: #fff; border-color: #0000aa; }
:root[data-theme="qbasic"] .modal .modal-head { background: #aaaaaa; color: #000; justify-content: center; border-bottom: 1px solid #000; }
.modal.wide { width: min(900px, 100%); }
.modal-head { padding: 8px 14px; font-weight: 700; background: var(--pane-head); color: var(--pane-head-fg); display: flex; align-items: center; gap: 8px; }
.modal-body { padding: 14px; overflow: auto; }
.modal-body p { margin: 0 0 10px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal input[type=text], .modal textarea, .modal select { width: 100%; background: var(--input); border: 1px solid var(--border); padding: 6px 8px; border-radius: var(--radius); }
.modal textarea { min-height: 120px; font-family: var(--font-code); font-size: 12px; }
.modal label { display: block; margin: 8px 0 4px; font-weight: 600; }
.btn { height: 30px; padding: 0 14px; border: 1px solid var(--border); background: var(--btn); color: var(--btn-fg); border-radius: var(--radius); }
.btn:hover { background: var(--btn-hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
:root[data-theme="qbasic"] .btn { background: #aaaaaa; border: 1px solid #000; color: #000; }
:root[data-theme="qbasic"] .btn.primary { background: #0000aa; color: #fff; }
.toasts { position: fixed; right: 14px; bottom: 30px; display: flex; flex-direction: column; gap: 6px; z-index: 3000; pointer-events: none; }
.toast { background: var(--menu); color: var(--menu-fg); border: 1px solid var(--border); padding: 8px 12px; box-shadow: var(--shadow); max-width: 380px; border-radius: var(--radius); animation: toast-in .2s ease-out; pointer-events: auto; }
.toast.err { border-left: 4px solid var(--err); }
.toast.ok { border-left: 4px solid var(--ok); }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } }
.ctx-menu { position: fixed; z-index: 2500; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.kbd-table td { padding: 3px 10px 3px 0; vertical-align: top; }
.err-text { color: var(--err); }
.muted { color: var(--muted); }

/* gallery */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--border); background: var(--pane2); padding: 10px; cursor: pointer; border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px; text-align: left; }
.card:hover { border-color: var(--accent); }
.card .t { font-weight: 700; }
.card .d { font-size: 12px; color: var(--muted); }
:root[data-theme="qbasic"] .card .d { color: #222; }
.card .tags { font-size: 10px; display: flex; gap: 4px; flex-wrap: wrap; }
.card .tags span { padding: 0 5px; border-radius: 3px; background: rgba(127,127,127,.25); }

/* help */
.help { display: grid; grid-template-columns: 200px 1fr; height: 70vh; }
.help-nav { border-right: 1px solid var(--border); overflow: auto; padding: 6px 0; }
.help-nav input { margin: 0 6px 6px; width: calc(100% - 12px) !important; }
.help-nav div { padding: 2px 10px; cursor: pointer; font-family: var(--font-code); font-size: 12px; }
.help-nav div:hover, .help-nav div.sel { background: var(--menu-sel); color: var(--menu-sel-fg); }
.help-nav .grp { font: 600 11px var(--font-ui); color: var(--muted); text-transform: uppercase; padding-top: 8px; cursor: default; }
.help-nav .grp:hover { background: none; color: var(--muted); }
.help-main { overflow: auto; padding: 4px 16px 16px; }
.help-main h2 { margin: 8px 0; font-family: var(--font-code); font-size: 18px; }
.help-main pre, .help-main code { font-family: var(--font-code); }
.help-main pre { background: var(--ed-bg); color: var(--ed-fg); padding: 8px 10px; overflow: auto; border-radius: var(--radius); }
.help-main .syntax { background: var(--pane2); padding: 6px 10px; border-left: 3px solid var(--accent); font-family: var(--font-code); white-space: pre-wrap; }
:root[data-theme="qbasic"] .help-main pre { color: #ccc; }
.help-main table { border-collapse: collapse; }
.help-main td, .help-main th { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }

/* tour */
.tour-hole { position: fixed; z-index: 4000; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); pointer-events: none; transition: all .25s ease; outline: 2px solid var(--accent); }
.tour-pop { position: fixed; z-index: 4001; width: min(360px, calc(100vw - 24px)); background: var(--pane); color: var(--text); border: 1px solid var(--accent); box-shadow: var(--shadow); padding: 12px 14px; border-radius: 8px; }
:root[data-theme="qbasic"] .tour-pop { background: #aaaaaa; color: #000; border: 2px solid #fff; box-shadow: 6px 6px 0 #000; border-radius: 0; }
.tour-pop h3 { margin: 0 0 6px; font-size: 15px; }
.tour-pop p { margin: 0 0 8px; }
.tour-pop .tour-foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.tour-pop .tour-foot .count { margin-right: auto; font-size: 12px; opacity: .7; }
.tour-pop code { font-family: var(--font-code); background: rgba(127,127,127,.2); padding: 0 3px; }
.tour-wait { font-size: 12px; color: var(--accent); margin-top: 4px; }
:root[data-theme="qbasic"] .tour-wait { color: #0000aa; }

/* ===== Mobile ============================================================ */
.mobile-tabs { display: none; }
@media (max-width: 820px) {
  .app { grid-template-rows: auto auto auto minmax(0, 1fr) 0 0 auto; }
  .mobile-tabs { display: flex; background: var(--pane2); border-bottom: 1px solid var(--border); }
  .mobile-tabs button { flex: 1; border: 0; background: none; padding: 8px 0; color: var(--muted); border-bottom: 2px solid transparent; }
  .mobile-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .workspace { grid-template-columns: 1fr !important; }
  .workspace > * { display: none !important; }
  .splitter { display: none !important; }
  .app[data-mview="editor"] .editor-area, .app[data-mview="screen"] .screen-area, .app[data-mview="files"] .explorer { display: flex !important; }
  .app[data-mview="debug"] .workspace { display: none; }
  .app[data-mview="debug"] { grid-template-rows: auto auto auto 0 0 minmax(0, 1fr) auto; }
  .app:not([data-mview="debug"]) .bottom { display: none; }
  .toolbar .tb-btn .lbl { display: none; }
  .menubar { overflow-x: auto; scrollbar-width: none; }
  .menubar .brand { font-size: 0; margin-right: 4px; }
  .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .toolbar .tb-label, .toolbar .state-pill, .toolbar .grow { display: none; }
  .toolbar select { max-width: 110px; }
  .tb-btn { padding: 0 7px; flex: none; }
  .mobile-tabs button { flex: 1 1 0; min-width: 0; }
  .menubar .proj { display: none; }
  .menu-btn { padding: 3px 6px; }
  .help { grid-template-columns: 1fr; grid-template-rows: 120px 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<body>
<div id="app" class="app">
  <header class="menubar" id="menubar" role="menubar" aria-label="Main menu"></header>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Run and debug"></div>
  <nav class="mobile-tabs" id="mobileTabs" aria-label="Views">
    <button data-view="editor" class="active">Code</button>
    <button data-view="screen">Screen</button>
    <button data-view="debug">Debug</button>
    <button data-view="files">Files</button>
  </nav>
  <main class="workspace" id="workspace">
    <aside class="explorer pane" id="explorer" aria-label="Files">
      <div class="pane-head"><span>Files</span><span class="pane-actions" id="explorerActions"></span></div>
      <div class="explorer-body" id="explorerTree"></div>
      <div class="pane-head small"><span>Procedures</span></div>
      <div class="proc-list" id="procList"></div>
    </aside>
    <div class="splitter v" data-split="explorer" aria-hidden="true"></div>
    <section class="editor-area pane" id="editorArea" aria-label="Editor">
      <div class="tabs" id="editorTabs" role="tablist"></div>
      <div class="findbar" id="findbar" hidden></div>
      <div class="editors" id="editors"></div>
    </section>
    <div class="splitter v" data-split="screen" aria-hidden="true"></div>
    <section class="screen-area pane" id="screenArea" aria-label="Output screen">
      <div class="pane-head"><span id="screenTitle">Output</span><span class="pane-actions" id="screenActions"></span></div>
      <div class="screen-wrap" id="screenWrap">
        <div class="screen-frame" id="screenFrame">
          <canvas id="screen" tabindex="0" aria-label="Program output screen. Click to give the program keyboard focus."></canvas>
          <div class="crt" id="crt"></div>
        </div>
        <div class="screen-hint" id="screenHint">Click the screen to type into your program</div>
      </div>
    </section>
  </main>
  <div class="splitter h" data-split="bottom" aria-hidden="true"></div>
  <section class="bottom pane" id="bottom" aria-label="Debug panels">
    <div class="tabs bottom-tabs" id="bottomTabs" role="tablist"></div>
    <div class="bottom-body" id="bottomBody"></div>
  </section>
  <footer class="statusbar" id="statusbar" role="status"></footer>
</div>
<div id="overlay-root"></div>

          const e = this.parseExpr();
          this.expectOp(')');
          return mk([e]);
        }
        case 'EOF': case 'LOC': case 'LOF': case 'FILEATTR': case 'SEEK': {
          this.expectOp('(');
          const args = [];
          this.acceptOp('#');
          args.push(this.parseExpr());
          while (this.acceptOp(',')) args.push(this.parseExpr());
          this.expectOp(')');
          return mk(args);
        }
        case 'PEN': case 'STICK': case 'STRIG': case 'PLAY': case 'FRE': case 'POS': case 'LPOS': case 'IOCTL$':
        case 'ENVIRON$': case 'INP': case 'PEEK': case 'POINT': case 'PMAP': case 'SCREEN':
          return mk(this.parseArgList());
        case 'STRING': case 'INTEGER': case 'LONG': case 'SINGLE': case 'DOUBLE':
          this.fail('Expected: expression', t);
        // eslint-disable-next-line no-fallthrough
        default:
          if (B.BUILTIN_FNS && B.BUILTIN_FNS[name]) {
            const spec = B.BUILTIN_FNS[name];
            if (spec.noArgs) return mk([]);
            return mk(this.parseArgList());
          }
          this.p--;
          this.fail('Expected: expression');
      }
    }

    // ---- statements -----------------------------------------------------------
    parseAssignOrCall() {
      const save = this.p;
      const t = this.tok;
      if (t.v === 'ENDIF') { this.p++; return { k: 'ENDIF' }; } // friendly alias
      let target;
      try {
        target = this.parseRef(false);
      } catch (e) { target = null; }
      if (target && this.isOp('=')) {
        this.p++;
        if (target.k === 'fn') {
          if (target.args.length) this.fail('Expected: statement');
          target = { k: 'var', name: target.name, base: target.base, sfx: target.sfx, display: target.name, pos: target.pos };
        }
        const e = this.parseExpr();
        return { k: 'LET', target, e };
      }
      // Implicit SUB call: Name [arg, arg...]
      this.p = save;
      const nt = this.next();
      if (nt.t !== 'id') this.fail('Expected: statement');
      const args = [];
      if (!this.atStmtEnd()) {
        do args.push(this.parseCallArg()); while (this.acceptOp(','));
      }
      return { k: 'CALL', name: nt.v, base: nt.base, sfx: nt.sfx, args, implicit: true, pos: this.pos(nt) };
    }

    parseCallArg() {
      // Array passed as "name()"
      if (this.tok.t === 'id' && this.isOp('(', 1) && this.isOp(')', 2)) {
        const t = this.next(); this.p += 2;
        return { k: 'arrayname', name: t.v, base: t.base, sfx: t.sfx, pos: this.pos(t) };
      }
      return this.parseExpr();
    }

    parseLvalue() {
      if (this.tok.t !== 'id') this.fail('Expected: variable');
      const r = this.parseRef(false);
      if (r.k === 'fn') this.fail('Expected: variable');
      return r;
    }

    parseTarget() {
      // line number or label
      const t = this.tok;
      if (t.t === 'num') { this.p++; return { lineNo: t.v, pos: this.pos(t) }; }
      if (t.t === 'id') { this.p++; return { label: t.v, pos: this.pos(t) }; }
      this.fail('Expected: line number or label');
    }

    parseType() {
      const t = this.next();
      if (t.t === 'kw' && TYPE_KW[t.v]) {
        const base = TYPE_KW[t.v];
        if (base === 'string' && this.acceptOp('*')) {
          const n = this.tok;
          if (n.t === 'num') { this.p++; return { k: 'fixstr', len: n.v }; }
          if (n.t === 'id') { this.p++; return { k: 'fixstr', constName: n.v }; }
          this.fail('Expected: string length');
        }
        return { k: base };
      }
      if (t.t === 'id') return { k: 'user', name: t.v };
      this.fail('Expected: type', t);
    }

    // DIM / REDIM / STATIC / SHARED / COMMON variable lists
    parseDimList(allowBounds) {
      const vars = [];
      do {
        const t = this.next();
        if (t.t !== 'id') this.fail('Expected: variable name', t);
        const v = { name: t.v, base: t.base, sfx: t.sfx, display: t.name, pos: this.pos(t), dims: null, type: null };
        if (this.isOp('(')) {
          this.p++;
          v.dims = [];
          if (!this.isOp(')')) {
            do {
              if (!allowBounds) { this.parseExpr(); v.dims.push(null); continue; }
              const a = this.parseExpr();
              if (this.acceptKw('TO')) v.dims.push({ lo: a, hi: this.parseExpr() });
              else v.dims.push({ lo: null, hi: a });
            } while (this.acceptOp(','));
          }
          this.expectOp(')');
        }
        if (this.acceptKw('AS')) v.type = this.parseType();
        vars.push(v);
      } while (this.acceptOp(','));
      return vars;
    }

    parseParams() {
      const params = [];
      if (!this.acceptOp('(')) return params;
      if (this.acceptOp(')')) return params;
      do {
        let byval = this.acceptKw('BYVAL');
        const t = this.next();
        if (t.t !== 'id') this.fail('Expected: parameter name', t);
        const prm = { name: t.v, base: t.base, sfx: t.sfx, display: t.name, isArray: false, type: null, byval, pos: this.pos(t) };
        if (this.acceptOp('(')) {
          // optional dimension count (ignored) in DECLARE
          if (this.tok.t === 'num') this.p++;
          this.expectOp(')');
          prm.isArray = true;
        }
        if (this.acceptKw('AS')) prm.type = this.parseType();
        params.push(prm);
      } while (this.acceptOp(','));
      this.expectOp(')');
      return params;
    }

    // Optional args list with possible empty slots:  a, , c
    parseOptArgs(max) {
      const args = [];
      if (this.atStmtEnd()) return args;
      while (true) {
        if (this.isOp(',')) { args.push(null); this.p++; if (this.atStmtEnd()) { args.push(null); break; } continue; }
        args.push(this.parseExpr());
        if (!this.acceptOp(',')) break;
        if (this.atStmtEnd()) { args.push(null); break; }
      }
      if (max && args.length > max) this.fail('Argument-count mismatch');
      return args;
    }

    parseCoord() {
      // [STEP] (x, y)
      const step = this.acceptKw('STEP');
      this.expectOp('(');
      const x = this.parseExpr();
      this.expectOp(',');
      const y = this.parseExpr();
      this.expectOp(')');
      return { step, x, y };
    }

    parseFileNum() {
      // [#]n
      this.acceptOp('#');
      return this.parseExpr();
    }

    // ---- individual statements ----
    st_REM() { return null; }
    st_LET() {
      const target = this.parseLvalue();
      this.expectOp('=');
      return { k: 'LET', target, e: this.parseExpr() };
    }
    st_MID_S() {
      // MID$(var$, start[, len]) = expr
      this.expectOp('(');
      const target = this.parseLvalue();
      this.expectOp(',');
      const start = this.parseExpr();
      let len = null;
      if (this.acceptOp(',')) len = this.parseExpr();
      this.expectOp(')');
      this.expectOp('=');
      return { k: 'MIDSET', target, start, len, e: this.parseExpr() };
    }

    parsePrintItems() {
      const items = [];
      while (!this.atStmtEnd()) {
        if (this.acceptOp(';')) { items.push({ k: 'semi' }); continue; }
        if (this.acceptOp(',')) { items.push({ k: 'comma' }); continue; }
        if (this.isKw('TAB') || this.isKw('SPC')) {
          const kw = this.next().v;
          this.expectOp('(');
          const e = this.parseExpr();
          this.expectOp(')');
          items.push({ k: kw === 'TAB' ? 'tab' : 'spc', e });
          continue;
        }
        if (this.isKw('USING')) this.fail('USING must come first');
        items.push({ k: 'expr', e: this.parseExpr() });
      }
      return items;
    }
    st_PRINT(t) {
      let file = null, using = null;
      if (this.acceptOp('#')) {
        file = this.parseExpr();
        if (!this.acceptOp(',')) { if (!this.atStmtEnd()) this.expectOp(','); }
      }
      if (this.acceptKw('USING')) {
        using = this.parseExpr();
        this.expectOp(';');
      }
      return { k: 'PRINT', file, using, items: this.parsePrintItems() };
    }
    st_LPRINT() {
      let using = null;
      if (this.acceptKw('USING')) { using = this.parseExpr(); this.expectOp(';'); }
      return { k: 'PRINT', lpt: true, file: null, using, items: this.parsePrintItems() };
    }
    st_WRITE() {
      let file = null;
      if (this.acceptOp('#')) { file = this.parseExpr(); if (!this.atStmtEnd()) this.expectOp(','); }
      const items = [];
      while (!this.atStmtEnd()) {
        items.push(this.parseExpr());
        if (!this.acceptOp(',') && !this.acceptOp(';')) break;
      }
      return { k: 'WRITE', file, items };
    }
    st_INPUT() {
      if (this.acceptOp('#')) {
        const file = this.parseExpr();
        this.expectOp(',');
        const vars = [];
        do vars.push(this.parseLvalue()); while (this.acceptOp(','));
        return { k: 'INPUTF', file, vars };
      }
      const noNewline = this.acceptOp(';');
      let prompt = null, qmark = true;
      if (this.tok.t === 'str') {
        prompt = this.next().v;
        if (this.acceptOp(',')) qmark = false;
        else this.expectOp(';');
      }
      const vars = [];
      do vars.push(this.parseLvalue()); while (this.acceptOp(','));
      return { k: 'INPUT', prompt, qmark, noNewline, vars };
    }
    st_LINE(t, inline) {
      if (this.acceptKw('INPUT')) {
        if (this.acceptOp('#')) {
          const file = this.parseExpr();
          this.expectOp(',');
          return { k: 'LINEINPUTF', file, target: this.parseLvalue() };
        }
        const noNewline = this.acceptOp(';');
        let prompt = null;
        if (this.tok.t === 'str') {
          prompt = this.next().v;
          if (!this.acceptOp(';')) this.expectOp(',');
        }
        return { k: 'LINEINPUT', prompt, noNewline, target: this.parseLvalue() };
      }
      // LINE [[STEP](x1,y1)]-[STEP](x2,y2)[,[color][,[B|BF][,style]]]
      let p1 = null;
      if (!this.isOp('-')) p1 = this.parseCoord();
      this.expectOp('-');
      const p2 = this.parseCoord();
      let color = null, box = null, style = null;
      if (this.acceptOp(',')) {
        if (!this.isOp(',') && !this.atStmtEnd()) color = this.parseExpr();
        if (this.acceptOp(',')) {
          if (this.tok.t === 'id' && (this.tok.v === 'B' || this.tok.v === 'BF')) { box = this.next().v; }
          if (this.acceptOp(',')) style = this.parseExpr();
        }
      }
      return { k: 'GLINE', p1, p2, color, box, style };
    }
    st_DIM(t) { const shared = this.acceptKw('SHARED'); return { k: 'DIM', shared, vars: this.parseDimList(true) }; }
    st_REDIM() {
      const preserve = this.acceptKw('PRESERVE');
      const shared = this.acceptKw('SHARED');
      return { k: 'DIM', redim: true, preserve, shared, vars: this.parseDimList(true) };
    }
    st_STATIC() { return { k: 'STATICVARS', vars: this.parseDimList(false) }; }
    st_SHARED() { return { k: 'SHAREDVARS', vars: this.parseDimList(false) }; }
    st_COMMON() {
      const shared = this.acceptKw('SHARED');
      if (this.acceptOp('/')) { this.next(); this.expectOp('/'); }
      return { k: 'COMMON', shared, vars: this.parseDimList(false) };
    }
    st_ERASE() {
      const names = [];
      do {
        const t = this.next();
        if (t.t !== 'id') this.fail('Expected: array name', t);
        names.push({ k: 'arrayname', name: t.v, base: t.base, sfx: t.sfx, pos: this.pos(t) });
        if (this.acceptOp('(')) this.expectOp(')');
      } while (this.acceptOp(','));
      return { k: 'ERASE', names };
    }
    st_CONST() {
      const items = [];
      do {
        const t = this.next();
        if (t.t !== 'id') this.fail('Expected: identifier', t);
        this.expectOp('=');
        items.push({ name: t.v, base: t.base, sfx: t.sfx, display: t.name, e: this.parseExpr(), pos: this.pos(t) });
      } while (this.acceptOp(','));
      return { k: 'CONST', items };
    }
    defType(ty) {
      const ranges = [];
      do {
        const a = this.next();
        if (a.t !== 'id' || a.base.length !== 1) this.fail('Expected: letter range', a);
        let b = a;
        if (this.acceptOp('-')) { b = this.next(); if (b.t !== 'id' || b.base.length !== 1) this.fail('Expected: letter', b); }
        ranges.push([a.base, b.base]);
      } while (this.acceptOp(','));
      return { k: 'DEFTYPE', ty, ranges };
    }
    st_DEFINT() { return this.defType('int'); }
    st_DEFLNG() { return this.defType('long'); }
    st_DEFSNG() { return this.defType('single'); }
    st_DEFDBL() { return this.defType('double'); }
    st_DEFSTR() { return this.defType('string'); }
    st_OPTION() {
      this.expectKw('BASE');
      const n = this.next();
      if (n.t !== 'num' || (n.v !== 0 && n.v !== 1)) this.fail('Expected: 0 or 1', n);
      return { k: 'OPTIONBASE', v: n.v };
    }
    st_DECLARE() {
      const kind = this.next();
      if (kind.t !== 'kw' || (kind.v !== 'SUB' && kind.v !== 'FUNCTION')) this.fail('Expected: SUB or FUNCTION', kind);
      const n = this.next();
      if (n.t !== 'id') this.fail('Expected: name', n);
      if (this.tok.t === 'id' && this.tok.v === 'CDECL') this.p++;
      if (this.tok.t === 'id' && this.tok.v === 'ALIAS') { this.p++; this.p++; }
      const params = this.parseParams();
      return { k: 'DECLARE', kind: kind.v, name: n.v, params };
    }
    st_SUB() {
      const n = this.next();
      if (n.t !== 'id') this.fail('Expected: name', n);
      const params = this.parseParams();
      const isStatic = this.acceptKw('STATIC');
      return { k: 'SUB', name: n.v, base: n.base, sfx: n.sfx, display: n.name, params, isStatic };
    }
    st_FUNCTION() {
      const n = this.next();
      if (n.t !== 'id') this.fail('Expected: name', n);
      const params = this.parseParams();
      const isStatic = this.acceptKw('STATIC');
      return { k: 'FUNCTION', name: n.v, base: n.base, sfx: n.sfx, display: n.name, params, isStatic };
    }
    st_TYPE() {
      const n = this.next();
      if (n.t !== 'id') this.fail('Expected: type name', n);
      // TYPE body: consume following lines until END TYPE
      const fields = [];
      const startPos = this.pos(n);
      if (!this.atEnd()) this.fail('Expected: end-of-statement');
      let li = this.lines.indexOf(this.lineInfo);
      while (true) {
        li++;
        if (li >= this.lines.length) throw new CompileError('TYPE without END TYPE', startPos);
        const L = this.lines[li];
        this.lineInfo = L;
        this.toks = L.tokens;
        this.p = 0;
        if (this.tok.t === 'eol' || this.tok.t === 'rem') continue;
        if (this.isKw('END') && this.isKw('TYPE', 1)) {
          this.p += 2;
          L.consumed = true;
          break;
        }
        const f = this.next();
        if (f.t !== 'id') this.fail('Expected: field name', f);
        this.expectKw('AS');
        const ty = this.parseType();
        fields.push({ name: f.v, display: f.name, type: ty, pos: this.pos(f) });
        if (this.tok.t !== 'eol' && this.tok.t !== 'rem') this.fail('Expected: end-of-statement');
        L.consumed = true;
      }
      // Remaining lines are processed by parseProgram, which skips consumed lines.
      return { k: 'TYPE', name: n.v, display: n.name, fields };
    }
    st_DEF(t) {
      if (this.acceptKw('SEG')) {
        let e = null;
        if (this.acceptOp('=')) e = this.parseExpr();
        return { k: 'DEFSEG', e };
      }
      if (this.tok.t === 'kw' && this.tok.v === 'USR') {
        // DEF USR[n] = addr : accepted and ignored
        this.p++;
        if (this.tok.t === 'num') this.p++;
        this.expectOp('=');
        this.parseExpr();
        return { k: 'NOP' };
      }
      let n = this.next();
      if (n.t === 'id' && n.v === 'FN' && this.tok.t === 'id') {
        const n2 = this.next();
        n = Object.assign({}, n2, { v: 'FN' + n2.v, base: 'FN' + n2.base, name: 'FN' + n2.name });
      }
      if (n.t !== 'id' || !n.base.startsWith('FN')) this.fail('Expected: FNname', n);
      const params = this.parseParams();
      if (this.acceptOp('=')) {
        return { k: 'DEFFN', name: n.v, base: n.base, sfx: n.sfx, display: n.name, params, e: this.parseExpr(), single: true };
      }
      return { k: 'DEFFN', name: n.v, base: n.base, sfx: n.sfx, display: n.name, params, single: false };
    }
    st_END() {
      const t = this.tok;
      if (t.t === 'kw') {
        const map = { IF: 'ENDIF', SELECT: 'ENDSELECT', SUB: 'ENDSUB', FUNCTION: 'ENDFUNCTION', DEF: 'ENDDEF', TYPE: 'ENDTYPE' };
        if (map[t.v]) { this.p++; return { k: map[t.v] }; }
      }
      return { k: 'END' };
    }
    st_EXIT() {
      const t = this.next();
      if (t.t !== 'kw' || !['FOR', 'DO', 'SUB', 'FUNCTION', 'DEF'].includes(t.v)) this.fail('Expected: FOR, DO, SUB, FUNCTION or DEF', t);
      return { k: 'EXIT', what: t.v };
    }
    st_IF(t, inline) {
      const cond = this.parseExpr();
      if (this.acceptKw('GOTO')) {
        const tgt = this.parseTarget();
        const thenList = [{ k: 'GOTO', target: tgt, pos: tgt.pos }];
        let elseList = null;
        if (this.acceptKw('ELSE')) elseList = this.parseElsePart();
        return { k: 'IF1', cond, then: thenList, else: elseList };
      }
      this.expectKw('THEN');
      // Block IF: nothing (or a comment) after THEN
      if (!inline && (this.tok.t === 'eol' || this.tok.t === 'rem')) {
        return { k: 'IFBLOCK', cond };
      }
      let thenList;
      if (this.tok.t === 'num') {
        const n = this.next();
        thenList = [{ k: 'GOTO', target: { lineNo: n.v, pos: this.pos(n) }, pos: this.pos(n) }];
      } else thenList = this.parseInlineList();
      let elseList = null;
      if (this.acceptKw('ELSE')) elseList = this.parseElsePart();
      return { k: 'IF1', cond, then: thenList, else: elseList };
    }
    parseElsePart() {
      if (this.tok.t === 'num') {
        const n = this.next();
        return [{ k: 'GOTO', target: { lineNo: n.v, pos: this.pos(n) }, pos: this.pos(n) }];
      }
      return this.parseInlineList();
    }
    st_ELSEIF() {
      const cond = this.parseExpr();
      this.expectKw('THEN');
      return { k: 'ELSEIF', cond };
    }
    st_ELSE(t, inline) {
      if (inline) this.fail('ELSE without IF');
      return { k: 'ELSE' };
    }
    st_SELECT() {
      this.expectKw('CASE');
      return { k: 'SELECT', e: this.parseExpr() };
    }
    st_CASE() {
      if (this.acceptKw('ELSE')) return { k: 'CASE', isElse: true, tests: [] };
      const tests = [];
      do {
        if (this.acceptKw('IS')) {
          const op = this.next();
          if (op.t !== 'op' || !['=', '<>', '<', '>', '<=', '>='].includes(op.v)) this.fail('Expected: relational operator', op);
          tests.push({ k: 'is', op: op.v, e: this.parseExpr() });
        } else if (this.tok.t === 'op' && ['<', '>', '<=', '>=', '<>', '='].includes(this.tok.v)) {
          // QBasic accepts "CASE < 5" as shorthand for IS
          const op = this.next();
          tests.push({ k: 'is', op: op.v, e: this.parseExpr() });
        } else {
          const a = this.parseExpr();
          if (this.acceptKw('TO')) tests.push({ k: 'range', a, b: this.parseExpr() });
          else tests.push({ k: 'eq', e: a });
        }
      } while (this.acceptOp(','));
      return { k: 'CASE', isElse: false, tests };
    }
    st_DO() {
      let cond = null, until = false;
      if (this.acceptKw('WHILE')) cond = this.parseExpr();
      else if (this.acceptKw('UNTIL')) { cond = this.parseExpr(); until = true; }
      return { k: 'DO', cond, until };
    }
    st_LOOP() {
      let cond = null, until = false;
      if (this.acceptKw('WHILE')) cond = this.parseExpr();
      else if (this.acceptKw('UNTIL')) { cond = this.parseExpr(); until = true; }
      return { k: 'LOOP', cond, until };
    }
    st_WHILE() { return { k: 'WHILE', cond: this.parseExpr() }; }
    st_WEND() { return { k: 'WEND' }; }
    st_FOR() {
      const v = this.parseLvalue();
      this.expectOp('=');
      const from = this.parseExpr();
      this.expectKw('TO');
      const to = this.parseExpr();
      let step = null;
      if (this.acceptKw('STEP')) step = this.parseExpr();
      return { k: 'FOR', v, from, to, step };
    }
    st_NEXT() {
      const vars = [];
      if (!this.atStmtEnd()) {
        do vars.push(this.parseLvalue()); while (this.acceptOp(','));
      }
      return { k: 'NEXT', vars };
    }
    st_GOTO() { return { k: 'GOTO', target: this.parseTarget() }; }
    st_GOSUB() { return { k: 'GOSUB', target: this.parseTarget() }; }
    st_RETURN() {
      if (!this.atStmtEnd()) return { k: 'RETURN', target: this.parseTarget() };
      return { k: 'RETURN', target: null };
    }
    st_ON(t) {
      // ON ERROR GOTO / ON event GOSUB / ON expr GOTO|GOSUB
      if (this.acceptKw('ERROR')) {
        if (this.acceptKw('RESUME')) { this.expectKw('NEXT'); return { k: 'ONERROR', resumeNext: true }; }
        this.expectKw('GOTO');
        const tgt = this.parseTarget();
        return { k: 'ONERROR', target: tgt.lineNo === 0 ? null : tgt };
      }
      const ev = this.tok;
      if (ev.t === 'kw' && ['TIMER', 'KEY', 'PLAY', 'STRIG', 'PEN', 'COM', 'UEVENT'].includes(ev.v) &&
        (ev.v === 'PEN' || ev.v === 'UEVENT' || this.isOp('(', 1))) {
        this.p++;
        let arg = null;
        if (this.acceptOp('(')) { arg = this.parseExpr(); this.expectOp(')'); }
        this.expectKw('GOSUB');
        const tgt = this.parseTarget();
        return { k: 'ONEVENT', ev: ev.v, arg, target: tgt.lineNo === 0 ? null : tgt };
      }
      const e = this.parseExpr();
      let gosub;
      if (this.acceptKw('GOTO')) gosub = false;
      else if (this.acceptKw('GOSUB')) gosub = true;
      else this.fail('Expected: GOTO or GOSUB');
      const targets = [];
      do targets.push(this.parseTarget()); while (this.acceptOp(','));
      return { k: 'ONGO', e, gosub, targets };
    }
    eventCtl(ev) {
      let arg = null;
