<!doctype html>
<html lang="en" data-theme="qbasic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compendium BASIC IDE</title>
<meta name="description" content="A retro GW-BASIC and QBasic IDE in your browser: write, run and debug BASIC with every classic screen mode, sound, files and guided tours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230000aa'/%3E%3Cpath d='M3 4h6v1H4v2h4v1H4v3H3z' fill='%23ffff55'/%3E%3Crect x='10' y='10' width='3' height='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/*@@CSS@@*/
</style>
</head>
<body>
<div id="app" class="app">
  <header class="menubar" id="menubar" role="menubar" aria-label="Main menu"></header>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Run and debug"></div>
  <nav class="mobile-tabs" id="mobileTabs" aria-label="Views">
    <button data-view="editor" class="active">Code</button>
    <button data-view="screen">Screen</button>
    <button data-view="debug">Debug</button>
    <button data-view="files">Files</button>
  </nav>
  <main class="workspace" id="workspace">
    <aside class="explorer pane" id="explorer" aria-label="Files">
      <div class="pane-head"><span>Files</span><span class="pane-actions" id="explorerActions"></span></div>
      <div class="explorer-body" id="explorerTree"></div>
      <div class="pane-head small"><span>Procedures</span></div>
      <div class="proc-list" id="procList"></div>
    </aside>
    <div class="splitter v" data-split="explorer" aria-hidden="true"></div>
    <section class="editor-area pane" id="editorArea" aria-label="Editor">
      <div class="tabs" id="editorTabs" role="tablist"></div>
      <div class="findbar" id="findbar" hidden></div>
      <div class="editors" id="editors"></div>
    </section>
    <div class="splitter v" data-split="screen" aria-hidden="true"></div>
    <section class="screen-area pane" id="screenArea" aria-label="Output screen">
      <div class="pane-head"><span id="screenTitle">Output</span><span class="pane-actions" id="screenActions"></span></div>
      <div class="screen-wrap" id="screenWrap">
        <div class="screen-frame" id="screenFrame">
          <canvas id="screen" tabindex="0" aria-label="Program output screen. Click to give the program keyboard focus."></canvas>
          <div class="crt" id="crt"></div>
        </div>
        <div class="screen-hint" id="screenHint">Click the screen to type into your program</div>
      </div>
    </section>
  </main>
  <div class="splitter h" data-split="bottom" aria-hidden="true"></div>
  <section class="bottom pane" id="bottom" aria-label="Debug panels">
    <div class="tabs bottom-tabs" id="bottomTabs" role="tablist"></div>
    <div class="bottom-body" id="bottomBody"></div>
  </section>
  <footer class="statusbar" id="statusbar" role="status"></footer>
</div>
<div id="overlay-root"></div>
<script>
//@@JS@@
</script>
</body>
</html>
